# Builda a imagem do frontend Next.js no GitHub Actions e publica no
# GitHub Container Registry. Easypanel só faz docker pull da imagem pronta.
#
# Imagem: ghcr.io/vitorfawkes/assistente-pessoal-frontend
# Apos primeiro push, tornar o package PUBLIC em github.com/users/VitorFawkes/packages.
# Em seguida, no easypanel: trocar source do service "assistente-frontend" de
# "github" pra "image" apontando pra ghcr.io/vitorfawkes/assistente-pessoal-frontend:latest

name: frontend image

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase repo owner
        id: owner
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          owner_lc=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "owner_lc=$owner_lc" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner_lc }}/assistente-pessoal-frontend:latest
            ghcr.io/${{ steps.owner.outputs.owner_lc }}/assistente-pessoal-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          platforms: linux/amd64
