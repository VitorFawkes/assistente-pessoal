name: coach checks
on:
  pull_request:
    paths: ["frontend/**", "db/00*_coach*.sql", "db/0028_leadership_coach.sql", "ops/coach-*", ".github/workflows/coach-checks.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: coach_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d coach_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - name: Typecheck and focused lint
        working-directory: frontend
        run: |
          bunx tsc --noEmit
          bunx eslint lib/coach lib/whatsapp lib/whatsapp.ts app/api/coach app/api/internal/coach app/api/internal/whatsapp app/coach components/coach components/site-header.tsx
      - name: Unit tests
        working-directory: frontend
        run: bun test
      - name: Isolated Postgres roles
        run: psql -h localhost -p 55432 -U postgres -d coach_test -v ON_ERROR_STOP=1 -c 'CREATE ROLE app_tenant LOGIN NOBYPASSRLS; CREATE ROLE app_writer LOGIN BYPASSRLS;'
      - name: Real tenant isolation and persistence
        working-directory: frontend
        env:
          COACH_TEST_DATABASE_URL: postgresql://postgres@localhost:55432/coach_test
        run: bun test lib/coach/store.integration.test.ts lib/coach/task-context.test.ts lib/coach/jobs.integration.test.ts lib/coach/calendar.integration.test.ts lib/coach/coach-commitments.integration.test.ts lib/whatsapp/channel.integration.test.ts lib/coach/task-actions.integration.test.ts lib/coach/finder.integration.test.ts
      - name: Private runner checks
        run: |
          python3 ops/coach-run.test.py
          python3 ops/coach-backfill.test.py
      - name: Production build without deployment
        working-directory: frontend
        run: bun run build

  offline-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - name: Install pinned Playwright and Chromium for synthetic browser checks
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/coach-browser-binaries
        run: |
          npm install --prefix "$RUNNER_TEMP/coach-browser" --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/coach-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Real dashboard with an offline synthetic API
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/coach-browser-binaries
          COACH_PLAYWRIGHT_MODULE: ${{ runner.temp }}/coach-browser/node_modules/playwright
          TMPDIR: ${{ runner.temp }}
        working-directory: frontend
        run: node scripts/coach-offline-browser-qa.cjs
      - name: Synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coach-offline-browser
          path: ${{ runner.temp }}/coach-offline-qa-*/
          if-no-files-found: warn
          retention-days: 7
