# Builda a imagem do voice-svc no runner do GitHub Actions e publica no
# GitHub Container Registry. Easypanel só faz `docker pull` da imagem pronta —
# não paga o custo do build (torch CPU ~500MB, speechbrain, ffmpeg).
#
# Imagem pública: ghcr.io/vitorfawkes/assistente-pessoal-voice-svc
# Após o primeiro push, abrir https://github.com/users/VitorFawkes/packages
# e tornar o package PUBLIC (caso contrário easypanel precisa de creds pra pull).

name: voice-svc image

on:
  push:
    branches: [main]
    paths:
      - "voice-svc/**"
      - ".github/workflows/voice-svc.yml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase repo owner
        id: owner
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          owner_lc=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "owner_lc=$owner_lc" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./voice-svc
          file: ./voice-svc/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner_lc }}/assistente-pessoal-voice-svc:latest
            ghcr.io/${{ steps.owner.outputs.owner_lc }}/assistente-pessoal-voice-svc:${{ github.sha }}
          cache-from: type=gha,scope=voice-svc
          cache-to: type=gha,mode=max,scope=voice-svc
          platforms: linux/amd64
