# XcodeGen spec — gera WelcomeAssistente.xcodeproj a partir desse YAML.
#
# Pra gerar/regenerar o project:
#   brew install xcodegen
#   cd ios-app && xcodegen generate
#
# O .xcodeproj resultante é gitignored — sempre regerável.

name: WelcomeAssistente
options:
  bundleIdPrefix: br.com.ttars
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: pt-BR
  generateEmptyDirectories: true
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_MODULE_VERIFIER: YES
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"  # iPhone only

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Configs/Debug.xcconfig
  Release: Configs/Release.xcconfig

targets:
  WelcomeAssistente:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: WelcomeAssistente
        excludes:
          - "Resources/Info.plist"
          - "Resources/PrivacyInfo.xcprivacy"
          - "Resources/WelcomeAssistente.entitlements"
    resources:
      - WelcomeAssistente/Resources/PrivacyInfo.xcprivacy
    # XcodeGen regenera info.path E entitlements.path a cada `generate`.
    # Por isso TODOS os keys customizados precisam vir aqui via `properties:`.
    # Não edite o Info.plist gerado manualmente — qualquer mudança é sobrescrita.
    info:
      path: WelcomeAssistente/Resources/Info.plist
      properties:
        CFBundleDisplayName: TTARS BR
        CFBundleDevelopmentRegion: pt-BR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
        UIRequiredDeviceCapabilities:
          - armv7
          - microphone
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: TTARS BR usa o microfone pra gravar suas reuniões e extrair tarefas automaticamente.
        # App não usa criptografia além da padrão do sistema (HTTPS) — evita
        # bloqueio MISSING_EXPORT_COMPLIANCE em cada build novo no TestFlight.
        ITSAppUsesNonExemptEncryption: false
        # URLs setadas via xcconfig por configuration (Debug vs Release).
        # O $() workaround é necessário no xcconfig porque `//` é comentário lá;
        # aqui no plist viraria string normal "https://host" no build.
        WelcomeBaseURL: $(WELCOME_BASE_URL)
        WelcomeIngestURL: $(WELCOME_INGEST_URL)
    entitlements:
      path: WelcomeAssistente/Resources/WelcomeAssistente.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:acoes.vitorgambetti.com.br
          - applinks:n8n-assistente-frontend.tatetz.easypanel.host
    settings:
      base:
        PRODUCT_NAME: TTARS BR
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OBJC_BRIDGING_HEADER: ""
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "1"
